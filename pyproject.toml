[project]
name = "machine-spec-parser"
version = "0.1.0"
description = "Turn messy industrial-machine datasheets (HTML) into clean, unit-normalized, validated specs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # runtime is stdlib-only on purpose

[project.scripts]
specparse = "machine_spec_parser.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/machine_spec_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
